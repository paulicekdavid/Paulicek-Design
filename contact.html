<section class="main-contact">


    <div class="contact-h1-wrapper">

        <h1 class="h1-contact">Got a project in mind? I’d love to hear <br class="br-contact"> what you’re working on. Fill out the <br class="br-contact"> form and let’s get things cookin’</h1>
    </div>


</section>


<div class="line"></div>


<section>
    <div class="form-wrapper">

        <div class="contact-img-wrapper">
            <img class="contact-img" src="contact-img.jpg" alt="Contact image">
        </div>


        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
                    
                    <input type="hidden" name="access_key" value="f400b1eb-7bd2-432d-a0f4-5f28115ce954">
                    
        <div class="form-grid">
            
            <div class="form-group">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="brand">Brand name</label>
                <input type="text" id="brand" name="brand">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="lead-source">How did you find me?</label>
                <input type="lead-source" id="lead-source" name="lead-source" required>
            </div>


            <div class="form-group">
                <label for="budget">What's your budget?</label>
                <input type="budget" id="budget" name="budget" required>
            </div>


            <div class="form-group">
                <label for="timeframe">What is your estimated deadline?</label>
                <div class="select-wrapper">
                    <select id="deadline" name="deadline">
                        <option value=""selected>Select an option</option>
                        <option value="2-4 months">2-4 months</option>
                        <option value="4-6 months">4-6 months</option>
                        <option value="6+ months">6+ Months</option>
                    </select>
                    <div class="select-arrow">
                        <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L6 6L11 1" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
            </div>



        </div>

                    <div class="form-group full-width">
                        <label for="message">Your message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="button2 submit-btn scramble-button">Submit</button>
        </form>

    </div>
</section>
